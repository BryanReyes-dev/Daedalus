[workspace]
resolver = "2"
members = [
  "crates/runtime-protocol",
  "crates/runtime-engine",
  "crates/runtime-ipc",
  "apps/runtime-daemon",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
